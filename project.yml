name: CleanerApp
options:
  bundleIdPrefix: com.cleaner
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  CleanerApp:
    type: application
    platform: [macOS, iOS]
    sources:
      - CleanerApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cleaner.app
      INFOPLIST_FILE: CleanerApp/Resources/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      PRODUCT_NAME: "CleanerApp"
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: CleanerApp/Resources/CleanerApp.entitlements
