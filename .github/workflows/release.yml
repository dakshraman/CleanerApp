name: Release & Distribute MacPurge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract Version Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build MacPurge macOS Release Binary
        run: |
          xcodebuild build \
            -project MacPurge.xcodeproj \
            -scheme MacPurge_macOS \
            -configuration Release \
            -derivedDataPath build/ \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Package Signed Release Assets (.dmg & .zip)
        run: |
          mkdir -p dist
          APP_PATH="build/Build/Products/Release/MacPurge.app"
          
          # Force deep ad-hoc code signature
          codesign --force --deep --sign - "$APP_PATH"
          codesign -vvv --deep --strict "$APP_PATH"

          # Prepare DMG root with Applications symlink
          mkdir -p dmg_root
          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          codesign --force --deep --sign - dmg_root/MacPurge.app
          xattr -cr dmg_root

          # Package using ditto to preserve resource forks and codesign metadata
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/MacPurge-${{ env.VERSION }}.zip"
          hdiutil create -volname "MacPurge" -srcfolder dmg_root -ov -format UDZO "dist/MacPurge-${{ env.VERSION }}.dmg"
          rm -rf dmg_root

          # Generate SHA256 checksums
          cd dist
          shasum -a 256 "MacPurge-${{ env.VERSION }}.zip" > "MacPurge-${{ env.VERSION }}.zip.sha256"
          shasum -a 256 "MacPurge-${{ env.VERSION }}.dmg" > "MacPurge-${{ env.VERSION }}.dmg.sha256"
          cd ..

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ env.VERSION }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            LOG=$(git log -n 15 --pretty=format:"* %s (%h)" --no-merges)
          fi
          echo "### What's Changed" > release_notes.md
          echo "$LOG" >> release_notes.md
          echo "" >> release_notes.md
          echo "### ℹ️ First-Time Installation on macOS (Gatekeeper)" >> release_notes.md
          echo "Since MacPurge is open-source and free, if macOS Gatekeeper shows a warning upon opening for the first time:" >> release_notes.md
          echo "1. **Right-click (or Control-click)** on \`MacPurge.app\` in your \`/Applications\` folder." >> release_notes.md
          echo "2. Click **Open**, then select **Open** in the confirmation dialog." >> release_notes.md
          echo "3. Alternatively, run: \`xattr -cr /Applications/MacPurge.app\` in Terminal." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Verification Hashes (SHA256)" >> release_notes.md
          echo '```' >> release_notes.md
          cat dist/*.sha256 >> release_notes.md
          echo '```' >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: MacPurge ${{ env.VERSION }}
          body_path: release_notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/MacPurge-${{ env.VERSION }}.dmg
            dist/MacPurge-${{ env.VERSION }}.zip
            dist/MacPurge-${{ env.VERSION }}.dmg.sha256
            dist/MacPurge-${{ env.VERSION }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
